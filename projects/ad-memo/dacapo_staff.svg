<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 56" role="img" aria-labelledby="title desc">
  <title id="title">Da Capo musical staff ornament</title>
  <desc id="desc">A thin four-measure musical staff divider with varied notes and the marking D.C. al Fine.</desc>
  <rect width="1400" height="56" fill="#ffffff"/>
  <defs>
    <g id="note" fill="#202825" stroke="#202825" stroke-linecap="round">
      <ellipse cx="0" cy="0" rx="4.8" ry="3.1" transform="rotate(-18)"/>
      <path d="M4 -1V-15" stroke-width="1.35"/>
    </g>
  </defs>
  <g fill="none" stroke="#202825" stroke-width="1.15">
    <path d="M14 23H1386M14 27H1386M14 31H1386M14 35H1386M14 39H1386"/>
    <path d="M14 23V39M19 23V39M357 23V39M700 23V39M1043 23V39M1381 23V39M1386 23V39"/>
  </g>
