    <use href="#note" x="150" y="31"/>
    <use href="#note" x="230" y="29"/>
    <use href="#note" x="310" y="27"/>

    <use href="#note" x="413" y="27"/>
    <use href="#note" x="493" y="29"/>
    <use href="#note" x="573" y="31"/>
    <use href="#note" x="653" y="33"/>

    <use href="#note" x="756" y="35"/>
    <use href="#note" x="836" y="35"/>
    <use href="#note" x="916" y="33"/>
    <use href="#note" x="996" y="31"/>

    <use href="#note" x="1099" y="31"/>
    <use href="#note" x="1179" y="33"/>
    <use href="#note" x="1259" y="33"/>
    <use href="#note" x="1339" y="33"/>
    <path d="M1259 39Q1299 49 1339 39" fill="none" stroke="#202825" stroke-width="1.2"/>
  </g>
  <text x="1260" y="11" fill="#202825" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">D.C. al Fine</text>
